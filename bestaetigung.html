<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitgliedschaft aufgenommen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #222; background: #fff; padding: 32px; }

    h1 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }

    .summary { font-size: 14px; line-height: 1.6; color: #444; margin-bottom: 24px; max-width: 600px; }

    .links { margin-bottom: 32px; }
    .links a {
      display: block; font-size: 14px; color: #4a7c9b; text-decoration: none;
      margin-bottom: 8px;
    }
    .links a:hover { text-decoration: underline; }
    .links a::before { content: "↗ "; }

    .actions { display: flex; gap: 12px; }
    .btn {
      padding: 10px 24px; font-size: 14px; cursor: pointer; border: none;
      background: #222; color: #fff; font-weight: 600;
    }
    .btn:hover { background: #444; }

    /* Modal for Picker */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 100; justify-content: center; padding-top: 120px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; width: 560px; max-height: 480px; border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column;
      overflow: hidden; align-self: flex-start;
    }
    .modal-input {
      width: 100%; padding: 16px 20px; font-size: 16px; border: none;
      border-bottom: 1px solid #eee; outline: none;
    }
    .modal-results { overflow-y: auto; flex: 1; }
    .modal-section-label {
      padding: 8px 20px 4px; font-size: 11px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .modal-item {
      padding: 10px 20px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .modal-item:hover, .modal-item.selected { background: #f0f0f0; }
    .modal-item .item-label { flex: 1; }
    .modal-item .item-meta { font-size: 12px; color: #888; }
    .modal-spinner { padding: 12px 20px; font-size: 13px; color: #999; }
  </style>
</head>
<body>

  <h1>Mitgliedschaft aufgenommen</h1>

  <p class="summary" id="summaryText">
    Max und Anna Muster wurden als neues Mitglied erfasst und die Rechnung und der Willkommensbrief
    wurden per E-Mail an mm@mail.ch versendet.
  </p>

  <div class="links">
    <a href="index.html" id="linkMitglied">Max und Anna Muster, 987654</a>
    <a href="index.html" id="linkRechnung">Rechnung Nr. 876543, CHF 50.00</a>
  </div>

  <div class="actions">
    <button class="btn" id="btnNochEins">noch ein Mitglied erfassen</button>
    <button class="btn" onclick="window.location.href='index.html'">alle Mitglieder</button>
  </div>

  <!-- Picker Modal (same as index.html) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <input type="text" class="modal-input" id="modalInput" placeholder="Name eingeben..." autocomplete="off">
      <div class="modal-results" id="modalResults"></div>
    </div>
  </div>

  <script>
    const betrag = sessionStorage.getItem('erfassung_betrag') || '50.00';
    const mitgliedName = sessionStorage.getItem('erfassung_name') || 'Max Muster';

    document.getElementById('summaryText').textContent =
      mitgliedName + ' wurde als neues Mitglied erfasst und die Rechnung und der Willkommensbrief wurden versendet.';
    document.getElementById('linkMitglied').textContent = mitgliedName + ', 987654';
    document.getElementById('linkRechnung').textContent = 'Rechnung Nr. 876543, CHF ' + betrag;

    // ─── Picker Logic (reused from index) ───
    let allData = [];
    let modalItems = [];
    let selectedIndex = -1;
    let searchTimeout = null;

    fetch('data/mitglieder.json').then(r => r.json()).then(d => allData = d);

    function openModal() {
      sessionStorage.removeItem('erfassung_emails');
      document.getElementById('modalOverlay').classList.add('open');
      const input = document.getElementById('modalInput');
      input.value = '';
      selectedIndex = -1;
      modalItems = [];
      renderModalResults('', []);
      setTimeout(() => input.focus(), 50);
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      clearTimeout(searchTimeout);
    }

    function renderModalResults(query, kundenResults, loading) {
      const results = document.getElementById('modalResults');
      modalItems = [];
      let html = '';

      html += '<div class="modal-section-label">Neuerfassung</div>';
      const types = [
        { key: 'einzelmitgliedschaft', label: 'Mitgliedschaft' },
        { key: 'doppelmitgliedschaft', label: 'Doppelmitgliedschaft' },
        { key: 'firmenmitgliedschaft', label: 'Firmenmitgliedschaft' },
      ];
      types.forEach(t => {
        const idx = modalItems.length;
        modalItems.push({ action: 'new', type: t.key, query });
        html += `<div class="modal-item" data-index="${idx}">
          <span class="item-label">Erfassung ${t.label}${query.trim() ? ' &ldquo;' + escHtml(query.trim()) + '&rdquo;' : ''}</span>
        </div>`;
      });

      html += '<div class="modal-section-label">Bestehende Kunden</div>';
      if (!query.trim()) {
        html += '<div class="modal-spinner">Tippe einen Namen ein...</div>';
      } else if (loading) {
        html += '<div class="modal-spinner">Suche...</div>';
      } else if (kundenResults.length === 0) {
        html += '<div class="modal-spinner">Keine Treffer</div>';
      } else {
        kundenResults.forEach(m => {
          const idx = modalItems.length;
          modalItems.push({ action: 'open', data: m });
          let statusText = m.status === 'gekuendigt'
            ? `gekündigt (${new Date(m.status_datum).toLocaleDateString('de-CH')})`
            : m.status;
          html += `<div class="modal-item" data-index="${idx}">
            <span class="item-label">${escHtml(m.name)}<br><span class="item-meta">${escHtml(m.adresse.strasse)}, ${escHtml(m.adresse.plz)} ${escHtml(m.adresse.ort)}</span></span>
            <span class="item-meta">${statusText}</span>
          </div>`;
        });
      }

      results.innerHTML = html;
      updateSelection();
    }

    function updateSelection() {
      document.querySelectorAll('#modalResults .modal-item').forEach((el, i) => {
        el.classList.toggle('selected', i === selectedIndex);
        if (i === selectedIndex) el.scrollIntoView({ block: 'nearest' });
      });
    }

    function selectItem(index) {
      if (index < 0 || index >= modalItems.length) return;
      const item = modalItems[index];
      if (item.action === 'new') {
        const parts = (item.query || '').trim().split(/\s+/);
        const vorname = parts[0] || '';
        const nachname = parts.slice(1).join(' ') || '';
        window.location.href = `neuaufnahme.html?typ=${item.type}&vorname=${encodeURIComponent(vorname)}&nachname=${encodeURIComponent(nachname)}`;
      } else if (item.action === 'open') {
        const m = item.data;
        const typ = m.typ === 'doppelmitglied' ? 'doppelmitgliedschaft' : m.typ === 'firmenmitglied' ? 'firmenmitgliedschaft' : 'einzelmitgliedschaft';
        const p = new URLSearchParams({ typ, nummer: m.nummer });
        m.nutzer.forEach((n, i) => { p.set('vorname' + (i||''), n.vorname); p.set('nachname' + (i||''), n.nachname); });
        p.set('strasse', m.adresse.strasse);
        p.set('plz', m.adresse.plz);
        p.set('ort', m.adresse.ort);
        window.location.href = `neuaufnahme.html?${p.toString()}`;
      }
    }

    document.getElementById('modalInput').addEventListener('input', function () {
      const q = this.value;
      selectedIndex = -1;
      clearTimeout(searchTimeout);
      if (!q.trim()) { renderModalResults('', []); return; }
      renderModalResults(q, [], true);
      searchTimeout = setTimeout(() => {
        const lower = q.toLowerCase();
        const matches = allData.filter(m =>
          m.name.toLowerCase().includes(lower) || m.nummer.includes(lower)
        ).slice(0, 8);
        renderModalResults(q, matches, false);
      }, 500);
    });

    document.getElementById('modalInput').addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); selectedIndex = Math.min(selectedIndex + 1, modalItems.length - 1); updateSelection(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); selectedIndex = Math.max(selectedIndex - 1, 0); updateSelection(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (selectedIndex >= 0) selectItem(selectedIndex); }
      else if (e.key === 'Escape') { closeModal(); }
    });

    document.getElementById('modalResults').addEventListener('click', function (e) {
      const item = e.target.closest('.modal-item');
      if (item) selectItem(parseInt(item.dataset.index));
    });

    document.getElementById('modalOverlay').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });

    document.getElementById('btnNochEins').addEventListener('click', openModal);

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
