<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitgliederverwaltung</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #222; background: #fff; padding: 32px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { font-size: 22px; font-weight: 600; }

    /* Split Button */
    .split-btn { display: flex; position: relative; }
    .split-btn-main {
      padding: 8px 18px; background: #222; color: #fff; border: none;
      font-size: 14px; cursor: pointer; border-right: 1px solid #555;
    }
    .split-btn-arrow {
      padding: 8px 10px; background: #222; color: #fff; border: none;
      font-size: 12px; cursor: pointer;
    }
    .split-btn-main:hover, .split-btn-arrow:hover { background: #444; }
    .split-dropdown {
      display: none; position: absolute; top: 100%; right: 0;
      background: #fff; border: 1px solid #ccc; min-width: 240px; z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .split-dropdown.open { display: block; }
    .split-dropdown a {
      display: block; padding: 10px 16px; text-decoration: none;
      color: #222; font-size: 14px; border-bottom: 1px solid #eee;
    }
    .split-dropdown a:last-child { border-bottom: none; }
    .split-dropdown a:hover { background: #f5f5f5; }

    /* Search */
    .toolbar { margin-bottom: 16px; }
    .search-input {
      padding: 8px 12px; font-size: 14px; border: 1px solid #ccc;
      width: 300px; outline: none;
    }
    .search-input:focus { border-color: #888; }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 10px 12px; font-size: 13px; font-weight: 600;
      border-bottom: 2px solid #222; color: #555; text-transform: uppercase; letter-spacing: 0.5px;
    }
    td { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #eee; }
    tr:hover td { background: #f9f9f9; }

    /* Status Badge */
    .status { font-size: 12px; padding: 3px 8px; border-radius: 3px; display: inline-block; }
    .status-aktiv { background: #e8e8e8; color: #222; }
    .status-gekuendigt { background: #222; color: #fff; }

    /* Pagination */
    .pagination {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 20px; font-size: 14px; color: #666;
    }
    .pagination-buttons { display: flex; gap: 4px; }
    .pagination-buttons button {
      padding: 6px 12px; border: 1px solid #ccc; background: #fff;
      cursor: pointer; font-size: 14px;
    }
    .pagination-buttons button:hover { background: #f5f5f5; }
    .pagination-buttons button.active { background: #222; color: #fff; border-color: #222; }
    .pagination-buttons button:disabled { opacity: 0.4; cursor: default; }

    /* Modal Overlay */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 100; justify-content: center; padding-top: 120px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; width: 560px; max-height: 480px; border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column;
      overflow: hidden; align-self: flex-start;
    }
    .modal-input {
      width: 100%; padding: 16px 20px; font-size: 16px; border: none;
      border-bottom: 1px solid #eee; outline: none;
    }
    .modal-results {
      overflow-y: auto; flex: 1;
    }
    .modal-section-label {
      padding: 8px 20px 4px; font-size: 11px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .modal-item {
      padding: 10px 20px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .modal-item:hover, .modal-item.selected { background: #f0f0f0; }
    .modal-item .item-label { flex: 1; }
    .modal-item .item-type {
      font-size: 11px; color: #999; text-transform: uppercase;
    }
    .modal-item .item-meta {
      font-size: 12px; color: #888;
    }
    .modal-spinner {
      padding: 12px 20px; font-size: 13px; color: #999;
    }
    .modal-hint {
      padding: 16px 20px; font-size: 13px; color: #999; text-align: center;
    }
    .kbd {
      font-size: 11px; background: #eee; padding: 2px 6px; border-radius: 3px;
      border: 1px solid #ddd; font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Mitglieder</h1>
    <div class="split-btn">
      <button class="split-btn-main" id="btnNeu">Neu</button>
      <button class="split-btn-arrow" id="splitToggle">&#9660;</button>
      <div class="split-dropdown" id="splitDropdown">
        <a href="#" data-type="einzelmitgliedschaft">Einzelmitgliedschaft</a>
        <a href="#" data-type="doppelmitgliedschaft">Doppelmitgliedschaft</a>
        <a href="#" data-type="firmenmitgliedschaft">Firmenmitgliedschaft</a>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="Suche nach Name, Nummer, Ort...">
  </div>

  <table>
    <thead>
      <tr>
        <th>Nummer</th>
        <th>Name</th>
        <th>Strasse</th>
        <th>PLZ</th>
        <th>Ort</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div class="pagination">
    <span id="pageInfo"></span>
    <div class="pagination-buttons" id="pageButtons"></div>
  </div>

  <!-- Command Palette Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <input type="text" class="modal-input" id="modalInput" placeholder="Name eingeben..." autocomplete="off">
      <div class="modal-results" id="modalResults">
        <div class="modal-hint">Tippe einen Namen ein, um eine Neuerfassung zu starten oder bestehende Kunden zu finden.</div>
      </div>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 20;
    let allData = [];
    let filtered = [];
    let currentPage = 1;

    // Modal state
    let modalItems = [];
    let selectedIndex = -1;
    let searchTimeout = null;

    async function init() {
      const res = await fetch('data/mitglieder.json');
      allData = await res.json();
      filtered = allData;
      render();
    }

    function render() {
      const start = (currentPage - 1) * PAGE_SIZE;
      const page = filtered.slice(start, start + PAGE_SIZE);
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));

      document.getElementById('tableBody').innerHTML = page.map(m => `
        <tr>
          <td>${m.nummer}</td>
          <td>${m.name}</td>
          <td>${m.adresse.strasse}</td>
          <td>${m.adresse.plz}</td>
          <td>${m.adresse.ort}</td>
          <td><span class="status status-${m.status}">${m.status}</span></td>
        </tr>
      `).join('');

      document.getElementById('pageInfo').textContent =
        `${start + 1}–${Math.min(start + PAGE_SIZE, filtered.length)} von ${filtered.length}`;

      let btns = '';
      btns += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goTo(${currentPage - 1})">&laquo;</button>`;
      for (let i = 1; i <= totalPages; i++) {
        btns += `<button class="${i === currentPage ? 'active' : ''}" onclick="goTo(${i})">${i}</button>`;
      }
      btns += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goTo(${currentPage + 1})">&raquo;</button>`;
      document.getElementById('pageButtons').innerHTML = btns;
    }

    function goTo(page) {
      currentPage = page;
      render();
    }

    // Table search
    document.getElementById('searchInput').addEventListener('input', function () {
      const q = this.value.toLowerCase();
      filtered = allData.filter(m =>
        m.nummer.includes(q) ||
        m.name.toLowerCase().includes(q) ||
        m.adresse.strasse.toLowerCase().includes(q) ||
        m.adresse.plz.includes(q) ||
        m.adresse.ort.toLowerCase().includes(q) ||
        m.status.toLowerCase().includes(q)
      );
      currentPage = 1;
      render();
    });

    // ─── Modal Logic ───

    function openModal() {
      document.getElementById('modalOverlay').classList.add('open');
      const input = document.getElementById('modalInput');
      input.value = '';
      selectedIndex = -1;
      modalItems = [];
      renderModalResults('', []);
      setTimeout(() => input.focus(), 50);
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      clearTimeout(searchTimeout);
    }

    function renderModalResults(query, kundenResults, loading) {
      const results = document.getElementById('modalResults');

      modalItems = [];
      let html = '';

      // Section: Neuerfassung options (always shown immediately)
      html += '<div class="modal-section-label">Neuerfassung</div>';
      const types = [
        { key: 'einzelmitgliedschaft', label: 'Mitgliedschaft' },
        { key: 'doppelmitgliedschaft', label: 'Doppelmitgliedschaft' },
        { key: 'firmenmitgliedschaft', label: 'Firmenmitgliedschaft' },
      ];
      types.forEach(t => {
        const idx = modalItems.length;
        modalItems.push({ action: 'new', type: t.key, query });
        html += `<div class="modal-item" data-index="${idx}">
          <span class="item-label">Erfassung ${t.label} &ldquo;${escHtml(query)}&rdquo;</span>
        </div>`;
      });

      // Section: Existing customers
      html += '<div class="modal-section-label">Bestehende Kunden</div>';
      if (loading) {
        html += '<div class="modal-spinner">Suche...</div>';
      } else if (kundenResults.length === 0) {
        html += '<div class="modal-spinner">Keine Treffer</div>';
      } else {
        kundenResults.forEach(m => {
          const idx = modalItems.length;
          modalItems.push({ action: 'open', data: m });
          let statusText = m.status === 'gekuendigt'
            ? `gekündigt (${new Date(m.status_datum).toLocaleDateString('de-CH')})`
            : m.status;
          html += `<div class="modal-item" data-index="${idx}">
            <span class="item-label">${escHtml(m.name)}<br><span class="item-meta">${escHtml(m.adresse.strasse)}, ${escHtml(m.adresse.plz)} ${escHtml(m.adresse.ort)}</span></span>
            <span class="item-meta">${statusText}</span>
          </div>`;
        });
      }

      results.innerHTML = html;
      updateSelection();
    }

    function updateSelection() {
      document.querySelectorAll('#modalResults .modal-item').forEach((el, i) => {
        el.classList.toggle('selected', i === selectedIndex);
        if (i === selectedIndex) el.scrollIntoView({ block: 'nearest' });
      });
    }

    function selectItem(index) {
      if (index < 0 || index >= modalItems.length) return;
      const item = modalItems[index];
      if (item.action === 'new') {
        const parts = item.query.trim().split(/\s+/);
        const vorname = parts[0] || '';
        const nachname = parts.slice(1).join(' ') || '';
        window.location.href = `neuaufnahme.html?typ=${item.type}&vorname=${encodeURIComponent(vorname)}&nachname=${encodeURIComponent(nachname)}`;
      } else if (item.action === 'open') {
        const m = item.data;
        const typ = m.typ === 'doppelmitglied' ? 'doppelmitgliedschaft' : m.typ === 'firmenmitglied' ? 'firmenmitgliedschaft' : 'einzelmitgliedschaft';
        const p = new URLSearchParams({ typ, nummer: m.nummer });
        m.nutzer.forEach((n, i) => { p.set('vorname' + (i||''), n.vorname); p.set('nachname' + (i||''), n.nachname); });
        p.set('strasse', m.adresse.strasse);
        p.set('plz', m.adresse.plz);
        p.set('ort', m.adresse.ort);
        p.set('status', m.status);
        p.set('status_datum', m.status_datum);
        window.location.href = `neuaufnahme.html?${p.toString()}`;
      }
    }

    // Modal input handler
    document.getElementById('modalInput').addEventListener('input', function () {
      const q = this.value;
      selectedIndex = -1;
      clearTimeout(searchTimeout);

      if (!q.trim()) {
        renderModalResults('', []);
        return;
      }

      // Show new-options immediately, customers loading
      renderModalResults(q, [], true);

      // Simulate 500ms delay for customer search
      searchTimeout = setTimeout(() => {
        const lower = q.toLowerCase();
        const matches = allData.filter(m =>
          m.name.toLowerCase().includes(lower) ||
          m.nummer.includes(lower)
        ).slice(0, 8);
        renderModalResults(q, matches, false);
      }, 500);
    });

    // Keyboard navigation in modal
    document.getElementById('modalInput').addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (modalItems.length > 0) {
          selectedIndex = Math.min(selectedIndex + 1, modalItems.length - 1);
          updateSelection();
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (modalItems.length > 0) {
          selectedIndex = Math.max(selectedIndex - 1, 0);
          updateSelection();
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (selectedIndex >= 0) selectItem(selectedIndex);
      } else if (e.key === 'Escape') {
        closeModal();
      }
    });

    // Click on modal items
    document.getElementById('modalResults').addEventListener('click', function (e) {
      const item = e.target.closest('.modal-item');
      if (item) selectItem(parseInt(item.dataset.index));
    });

    // Close modal on overlay click
    document.getElementById('modalOverlay').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });

    // Open modal via "Neu" button
    document.getElementById('btnNeu').addEventListener('click', openModal);

    // Cmd+K shortcut
    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        openModal();
      }
    });

    // Split button dropdown
    document.getElementById('splitToggle').addEventListener('click', function (e) {
      e.stopPropagation();
      document.getElementById('splitDropdown').classList.toggle('open');
    });
    document.addEventListener('click', function () {
      document.getElementById('splitDropdown').classList.remove('open');
    });

    // Dropdown items → navigate directly to neuaufnahme
    document.querySelectorAll('#splitDropdown a').forEach(a => {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        window.location.href = `neuaufnahme.html?typ=${this.dataset.type}`;
      });
    });

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    init();
  </script>
</body>
</html>
