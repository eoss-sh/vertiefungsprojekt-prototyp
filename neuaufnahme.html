<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuaufnahme</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #222; background: #fff; padding: 32px; }

    .breadcrumb { font-size: 13px; color: #888; margin-bottom: 24px; }
    .breadcrumb a { color: #222; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    h1 { font-size: 22px; font-weight: 600; margin-bottom: 32px; }

    .columns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px; }
    .columns-dm { }
    .dm-row1 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px; margin-bottom: 8px; }
    .dm-row2 { max-width: 33%; }

    .col-section h2 {
      font-size: 15px; font-weight: 600; margin-bottom: 16px;
      border-bottom: 1px solid #eee; padding-bottom: 8px;
    }
    .col-section { margin-bottom: 24px; }

    .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .form-group { flex: 1; }
    .form-group.full { flex: 1 1 100%; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600; color: #666;
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #ccc;
      outline: none; font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #888; }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .footer-actions {
      margin-top: 40px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
    }
    .btn-subtle { font-size: 14px; color: #222; font-weight: 600; text-decoration: none; cursor: pointer; }
    .btn-subtle:hover { color: #222; }
    .btn {
      padding: 10px 24px; font-size: 14px; cursor: pointer; border: none;
      background: #222; color: #fff; font-weight: 600;
    }
    .btn:hover { background: #444; }

    /* Dubletten-Hinweis */
    .duplicate-banner {
      display: none; margin-top: 24px; padding: 12px 16px;
      background: #f5f5f5; border: 1px solid #ddd; font-size: 14px; line-height: 1.5;
    }
    .duplicate-banner.visible { display: block; }
    .duplicate-banner a {
      color: #222; font-weight: 600; text-decoration: underline; cursor: pointer;
    }
    .duplicate-banner a:hover { color: #555; }

    /* Picker Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 100; justify-content: center; padding-top: 120px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; width: 560px; max-height: 480px; border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column;
      overflow: hidden; align-self: flex-start;
    }
    .modal-input {
      width: 100%; padding: 16px 20px; font-size: 16px; border: none;
      border-bottom: 1px solid #eee; outline: none;
    }
    .modal-results { overflow-y: auto; flex: 1; }
    .modal-section-label {
      padding: 8px 20px 4px; font-size: 11px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .modal-item {
      padding: 10px 20px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .modal-item:hover, .modal-item.selected { background: #f0f0f0; }
    .modal-item .item-label { flex: 1; }
    .modal-item .item-meta { font-size: 12px; color: #888; }
    .modal-spinner { padding: 12px 20px; font-size: 13px; color: #999; }
    .modal-hint { padding: 16px 20px; font-size: 13px; color: #999; text-align: center; }
  </style>
</head>
<body>

  <div class="breadcrumb">
    <a href="index.html">Mitglieder</a> &rsaquo; Neuaufnahme
  </div>

  <h1 id="title"></h1>

  <div class="columns" id="formContent"></div>

  <div class="duplicate-banner" id="duplicateBanner"></div>

  <div class="footer-actions">
    <a class="btn-subtle" href="#" id="linkRechnung">&rsaquo; Rechnung geht an jemand anderen</a>
    <button class="btn" onclick="window.location.href='schritt3.html'">&rsaquo; Mitgliedschaft erfassen</button>
  </div>

  <!-- Picker Modal for Rechnungsempfänger -->
  <div class="modal-overlay" id="rgModalOverlay">
    <div class="modal">
      <input type="text" class="modal-input" id="rgModalInput" placeholder="Name oder Adresse eingeben..." autocomplete="off">
      <div class="modal-results" id="rgModalResults"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const typ = params.get('typ') || 'einzelmitgliedschaft';
    const vorname = params.get('vorname') || params.get('vorname0') || '';
    const nachname = params.get('nachname') || params.get('nachname0') || '';
    const vorname1 = params.get('vorname1') || '';
    const nachname1 = params.get('nachname1') || '';
    const strasse = params.get('strasse') || '';
    const plz = params.get('plz') || '';
    const ort = params.get('ort') || '';

    const titles = {
      einzelmitgliedschaft: 'Schritt 1 - Erfassung Personendaten',
      doppelmitgliedschaft: 'Schritt 1 - Erfassung Personendaten',
      firmenmitgliedschaft: 'Schritt 1 - Erfassung Firmendaten',
    };

    document.getElementById('title').textContent = titles[typ] || 'Neuaufnahme';

    let personBlockCounter = 0;
    function personBlock(title, vn, nn) {
      const id = 'person' + (personBlockCounter++);
      return `
        <div class="col-section" id="${id}">
          <h2>${title}</h2>
          <div class="form-row">
            <div class="form-group">
              <label>Anrede</label>
              <select data-field="anrede">
                <option value="">Anrede</option>
                <option>Herr</option>
                <option>Frau</option>
                <option value="">Leer</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Vorname</label>
              <input type="text" data-field="vorname" value="${escAttr(vn)}">
            </div>
            <div class="form-group">
              <label>Nachname</label>
              <input type="text" data-field="nachname" value="${escAttr(nn)}">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group full">
              <label>E-Mail</label>
              <input type="email">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group full">
              <label>Telefon</label>
              <input type="tel">
            </div>
          </div>
        </div>`;
    }

    function adresseBlock() {
      return `
        <div class="col-section">
          <h2>Adresse</h2>
          <div class="form-row">
            <div class="form-group full">
              <label>Strasse</label>
              <input type="text" value="${escAttr(strasse)}">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group full">
              <label>Adresszusatz</label>
              <input type="text">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group full">
              <label>PLZ / Ort</label>
              <input type="text" value="${escAttr((plz && ort) ? plz + ' ' + ort : plz || ort)}">
            </div>
          </div>
        </div>`;
    }

    function renderForm() {
      let html = '';

      if (typ === 'einzelmitgliedschaft') {
        // Col 1: Person
        html += '<div>' + personBlock('Person', vorname, nachname) + '</div>';
        // Col 2: Adresse
        html += '<div>' + adresseBlock() + '</div>';
        // Col 3: Memo
        html += `<div>
          <div class="col-section">
            <h2>Memo</h2>
            <div class="form-row">
              <div class="form-group full">
                <textarea placeholder=""></textarea>
              </div>
            </div>
          </div>
        </div>`;

      } else if (typ === 'doppelmitgliedschaft') {
        document.getElementById('formContent').className = 'columns-dm';
        // Row 1: Person 1, Person 2, Doppelmitgliedschaft
        html += '<div class="dm-row1">';
        html += '<div>' + personBlock('Person 1', vorname, nachname) + '</div>';
        html += '<div>' + personBlock('Person 2', vorname1, nachname1) + '</div>';
        html += `<div>
          <div class="col-section">
            <h2>Doppelmitgliedschaft</h2>
            <div class="form-row">
              <div class="form-group full">
                <label>Anrede Doppelmitgliedschaft</label>
                <select id="doppelAnrede">
                  <option value="">Bitte wählen</option>
                  <option>Herr und Frau</option>
                  <option>Frau und Herr</option>
                  <option>Herren</option>
                  <option>Frauen</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group full">
                <label>Doppelname</label>
                <input type="text" id="doppelName">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group full">
                <label>Memo</label>
                <textarea placeholder=""></textarea>
              </div>
            </div>
          </div>
        </div>`;
        html += '</div>';
        // Row 2: Adresse (full width)
        html += '<div class="dm-row2">' + adresseBlock() + '</div>';

      } else if (typ === 'firmenmitgliedschaft') {
        // Col 1: Firma + Memo
        html += `<div>
          <div class="col-section">
            <h2>Firma</h2>
            <div class="form-row">
              <div class="form-group full">
                <label>Firmenname</label>
                <input type="text" value="${escAttr(vorname + (nachname ? ' ' + nachname : ''))}">
              </div>
            </div>
          </div>
          <div class="col-section">
            <h2>Memo</h2>
            <div class="form-row">
              <div class="form-group full">
                <textarea placeholder=""></textarea>
              </div>
            </div>
          </div>
        </div>`;
        // Col 2: Kontakt (Person block with title "Kontakt")
        html += '<div>' + personBlock('Kontakt', '', '') + '</div>';
        // Col 3: Adresse
        html += '<div>' + adresseBlock() + '</div>';
      }

      document.getElementById('formContent').innerHTML = html;
    }

    function escAttr(s) {
      return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    renderForm();

    // ─── Doppelname Auto-Generierung ───

    if (typ === 'doppelmitgliedschaft') {
      const p1 = document.getElementById('person0');
      const p2 = document.getElementById('person1');
      const doppelAnrede = document.getElementById('doppelAnrede');
      const doppelName = document.getElementById('doppelName');
      let doppelNameTouched = false;

      doppelName.addEventListener('input', function () {
        doppelNameTouched = this.value.trim() !== '';
      });

      function autoGenerateDoppel() {
        const anrede1 = p1.querySelector('[data-field="anrede"]').value;
        const vn1 = p1.querySelector('[data-field="vorname"]').value.trim();
        const nn1 = p1.querySelector('[data-field="nachname"]').value.trim();
        const anrede2 = p2.querySelector('[data-field="anrede"]').value;
        const vn2 = p2.querySelector('[data-field="vorname"]').value.trim();
        const nn2 = p2.querySelector('[data-field="nachname"]').value.trim();

        // Anrede auto-setzen
        if (anrede1 && anrede2) {
          if (anrede1 === 'Frau' && anrede2 === 'Herr') doppelAnrede.value = 'Frau und Herr';
          else if (anrede1 === 'Herr' && anrede2 === 'Frau') doppelAnrede.value = 'Herr und Frau';
          else if (anrede1 === 'Frau' && anrede2 === 'Frau') doppelAnrede.value = 'Frauen';
          else if (anrede1 === 'Herr' && anrede2 === 'Herr') doppelAnrede.value = 'Herren';
        }

        // Name auto-setzen, nur wenn alle 4 Felder ausgefüllt und Name noch nicht manuell bearbeitet
        if (!doppelNameTouched && vn1 && nn1 && vn2 && nn2) {
          doppelName.value = vn1 + ' ' + nn1 + ' und ' + vn2 + ' ' + nn2;
        }
      }

      [p1, p2].forEach(p => {
        p.querySelectorAll('input[type="text"], select').forEach(el => {
          el.addEventListener('input', autoGenerateDoppel);
          el.addEventListener('change', autoGenerateDoppel);
        });
      });
    }

    // ─── Dublettenprüfung ───

    let allData = [];
    let dupTimeout = null;

    fetch('data/mitglieder.json').then(r => r.json()).then(d => {
      allData = d;
      setupDuplicateCheck();
    });

    function setupDuplicateCheck() {
      const formEl = document.getElementById('formContent');
      formEl.addEventListener('input', function (e) {
        if (e.target.tagName !== 'INPUT' || e.target.type === 'email' || e.target.type === 'tel') return;
        clearTimeout(dupTimeout);
        dupTimeout = setTimeout(checkDuplicates, 400);
      });
    }

    const typMapping = {
      einzelmitgliedschaft: 'einzelmitglied',
      doppelmitgliedschaft: 'doppelmitglied',
      firmenmitgliedschaft: 'firmenmitglied',
    };

    function checkDuplicates() {
      const banner = document.getElementById('duplicateBanner');
      const matches = [];
      const erwarteterTyp = typMapping[typ];

      if (typ === 'firmenmitgliedschaft') {
        const firmaInput = document.querySelector('.col-section h2');
        if (!firmaInput) return;
        const section = firmaInput.closest('.col-section');
        const nameInput = section ? section.querySelector('input[type="text"]') : null;
        const query = nameInput ? nameInput.value.trim().toLowerCase() : '';
        if (query.length < 2) { banner.classList.remove('visible'); return; }
        allData.forEach(m => {
          if (m.typ === erwarteterTyp && m.name.toLowerCase().includes(query)) matches.push(m);
        });
      } else {
        const sections = document.querySelectorAll('.col-section');
        sections.forEach(section => {
          const h2 = section.querySelector('h2');
          if (!h2 || (h2.textContent !== 'Person' && h2.textContent !== 'Person 1' && h2.textContent !== 'Person 2')) return;
          const inputs = section.querySelectorAll('input[type="text"]');
          if (inputs.length < 2) return;
          const vn = inputs[0].value.trim().toLowerCase();
          const nn = inputs[1].value.trim().toLowerCase();
          if (vn.length < 2 && nn.length < 2) return;
          allData.filter(m => m.typ === erwarteterTyp).forEach(m => {
            m.nutzer.forEach(n => {
              const matchVn = vn && n.vorname.toLowerCase().includes(vn);
              const matchNn = nn && n.nachname.toLowerCase().includes(nn);
              if ((vn && nn && matchVn && matchNn) || (!vn && nn.length >= 2 && matchNn) || (!nn && vn.length >= 2 && matchVn)) {
                if (!matches.find(x => x.nummer === m.nummer)) matches.push(m);
              }
            });
          });
        });
      }

      if (matches.length === 0) {
        banner.classList.remove('visible');
        return;
      }

      const items = matches.slice(0, 3).map(m => {
        const p = new URLSearchParams({ typ });
        m.nutzer.forEach((n, i) => { p.set('vorname' + (i || ''), n.vorname); p.set('nachname' + (i || ''), n.nachname); });
        p.set('strasse', m.adresse.strasse);
        p.set('plz', m.adresse.plz);
        p.set('ort', m.adresse.ort);
        return `<a href="neuaufnahme.html?${p.toString()}">${escAttr(m.name)} (${m.nummer}, ${escAttr(m.adresse.strasse)}, ${escAttr(m.adresse.plz)} ${escAttr(m.adresse.ort)})</a>`;
      });

      banner.innerHTML = 'Mögliche Dublette gefunden: ' + items.join(', ');
      banner.classList.add('visible');
    }

    // ─── E-Mail Sammlung für Schritt 3 ───
    function collectEmails() {
      const emails = [];
      document.querySelectorAll('input[type="email"]').forEach(input => {
        if (input.value.trim()) emails.push(input.value.trim());
      });
      return emails;
    }

    function saveEmailsToSession(source, emails) {
      const stored = JSON.parse(sessionStorage.getItem('erfassung_emails') || '{}');
      stored[source] = emails;
      sessionStorage.setItem('erfassung_emails', JSON.stringify(stored));
    }

    function collectMitgliedName() {
      const inputs = document.querySelectorAll('input[type="text"]');
      const names = [];
      // Collect vorname/nachname pairs from person blocks
      document.querySelectorAll('.col-section h2').forEach(h2 => {
        const section = h2.closest('.col-section');
        if (!section) return;
        const vn = section.querySelector('input[type="text"]:nth-of-type(1)');
        const nn = section.querySelector('input[type="text"]:nth-of-type(2)');
        if (vn && nn && vn.value.trim() && nn.value.trim()) {
          names.push(vn.value.trim() + ' ' + nn.value.trim());
        }
      });
      return names.length > 0 ? names[0] : (vorname + ' ' + nachname).trim();
    }

    // Save emails and name before navigating away
    document.querySelector('.btn').addEventListener('click', function (e) {
      e.preventDefault();
      saveEmailsToSession('schritt1', collectEmails());
      sessionStorage.setItem('erfassung_name', collectMitgliedName());
      window.location.href = 'schritt3.html';
    });

    // ─── Rechnungsempfänger Picker ───

    let rgModalItems = [];
    let rgSelectedIndex = -1;
    let rgSearchTimeout = null;

    function openRgModal() {
      document.getElementById('rgModalOverlay').classList.add('open');
      const input = document.getElementById('rgModalInput');
      input.value = '';
      rgSelectedIndex = -1;
      rgModalItems = [];
      renderRgResults('', [], false);
      setTimeout(() => input.focus(), 50);
    }

    function closeRgModal() {
      document.getElementById('rgModalOverlay').classList.remove('open');
      clearTimeout(rgSearchTimeout);
    }

    function renderRgResults(query, kundenResults, loading) {
      const results = document.getElementById('rgModalResults');
      rgModalItems = [];
      let html = '';

      html += '<div class="modal-section-label">Erfassung</div>';
      const types = [
        { key: 'rg_partner', label: 'Erfassung Rechnungspartner' },
        { key: 'rg_adresse', label: 'Erfassung Rechnungsadresse' },
        { key: 'rg_firma', label: 'Erfassung Rechnungspartner Firma' },
        { key: 'rg_doppel', label: 'Erfassung Rechnungsdoppelpartner' },
      ];
      types.forEach(t => {
        const idx = rgModalItems.length;
        const displayQuery = query.trim() ? ' ' + query.trim() : '';
        rgModalItems.push({ action: 'new', type: t.key, query });
        html += `<div class="modal-item" data-index="${idx}">
          <span class="item-label">${t.label}${displayQuery ? ' &ldquo;' + escAttr(displayQuery.trim()) + '&rdquo;' : ''}</span>
        </div>`;
      });

      html += '<div class="modal-section-label">Bestehende Mitglieder</div>';
      if (!query.trim()) {
        html += '<div class="modal-spinner">Tippe einen Namen ein...</div>';
      } else if (loading) {
        html += '<div class="modal-spinner">Suche...</div>';
      } else if (kundenResults.length === 0) {
        html += '<div class="modal-spinner">Keine Treffer</div>';
      } else {
        kundenResults.forEach(m => {
          const idx = rgModalItems.length;
          rgModalItems.push({ action: 'use', data: m });
          let statusText = m.status === 'gekuendigt'
            ? `Gekündigt am ${new Date(m.status_datum).toLocaleDateString('de-CH')}`
            : m.status;
          html += `<div class="modal-item" data-index="${idx}">
            <span class="item-label">Verwendung Partner ${escAttr(m.name)} - ${m.nummer}<br><span class="item-meta">${escAttr(m.adresse.strasse)}, ${escAttr(m.adresse.plz)} ${escAttr(m.adresse.ort)} - ${statusText}</span></span>
          </div>`;
        });
      }

      results.innerHTML = html;
      updateRgSelection();
    }

    function updateRgSelection() {
      document.querySelectorAll('#rgModalResults .modal-item').forEach((el, i) => {
        el.classList.toggle('selected', i === rgSelectedIndex);
        if (i === rgSelectedIndex) el.scrollIntoView({ block: 'nearest' });
      });
    }

    function selectRgItem(index) {
      if (index < 0 || index >= rgModalItems.length) return;
      saveEmailsToSession('schritt1', collectEmails());
      sessionStorage.setItem('erfassung_name', collectMitgliedName());
      const item = rgModalItems[index];
      if (item.action === 'new') {
        const parts = (item.query || '').trim().split(/\s+/);
        const vn = parts[0] || '';
        const nn = parts.slice(1).join(' ') || '';
        window.location.href = `schritt2.html?typ=${item.type}&vorname=${encodeURIComponent(vn)}&nachname=${encodeURIComponent(nn)}`;
      } else if (item.action === 'use') {
        const m = item.data;
        const p = new URLSearchParams({ typ: 'rg_partner' });
        m.nutzer.forEach((n, i) => { p.set('vorname' + (i||''), n.vorname); p.set('nachname' + (i||''), n.nachname); });
        p.set('strasse', m.adresse.strasse);
        p.set('plz', m.adresse.plz);
        p.set('ort', m.adresse.ort);
        window.location.href = `schritt2.html?${p.toString()}`;
      }
    }

    document.getElementById('rgModalInput').addEventListener('input', function () {
      const q = this.value;
      rgSelectedIndex = -1;
      clearTimeout(rgSearchTimeout);
      if (!q.trim()) { renderRgResults('', [], false); return; }
      renderRgResults(q, [], true);
      rgSearchTimeout = setTimeout(() => {
        const lower = q.toLowerCase();
        const matches = allData.filter(m =>
          m.name.toLowerCase().includes(lower) ||
          m.nummer.includes(lower) ||
          m.adresse.strasse.toLowerCase().includes(lower) ||
          m.adresse.ort.toLowerCase().includes(lower)
        ).slice(0, 8);
        renderRgResults(q, matches, false);
      }, 500);
    });

    document.getElementById('rgModalInput').addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); rgSelectedIndex = Math.min(rgSelectedIndex + 1, rgModalItems.length - 1); updateRgSelection(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); rgSelectedIndex = Math.max(rgSelectedIndex - 1, 0); updateRgSelection(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (rgSelectedIndex >= 0) selectRgItem(rgSelectedIndex); }
      else if (e.key === 'Escape') { closeRgModal(); }
    });

    document.getElementById('rgModalResults').addEventListener('click', function (e) {
      const item = e.target.closest('.modal-item');
      if (item) selectRgItem(parseInt(item.dataset.index));
    });

    document.getElementById('rgModalOverlay').addEventListener('click', function (e) {
      if (e.target === this) closeRgModal();
    });

    document.getElementById('linkRechnung').addEventListener('click', function (e) {
      e.preventDefault();
      openRgModal();
    });
  </script>
</body>
</html>
