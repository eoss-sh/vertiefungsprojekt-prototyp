<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schritt 3 - Mitgliedschaft & Abrechnung</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #222; background: #fff; padding: 32px; }

    .breadcrumb { font-size: 13px; color: #888; margin-bottom: 24px; }
    .breadcrumb a { color: #222; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    h1 { font-size: 22px; font-weight: 600; margin-bottom: 32px; }

    .columns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px; }

    .col-section h2 {
      font-size: 15px; font-weight: 600; margin-bottom: 16px;
      border-bottom: 1px solid #eee; padding-bottom: 8px;
    }
    .col-section { margin-bottom: 24px; }

    .form-row { margin-bottom: 12px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600; color: #666;
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .form-group select {
      width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #ccc; outline: none;
    }
    .form-group select:focus { border-color: #888; }

    /* Checkbox / Radio rows */
    .check-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px;
    }
    .check-row input[type="checkbox"], .check-row input[type="radio"] {
      width: 16px; height: 16px; accent-color: #222;
    }
    .check-row select {
      padding: 4px 8px; font-size: 13px; border: 1px solid #ccc; outline: none;
    }

    /* Document preview card */
    .preview-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px; margin-top: 24px;
    }
    .doc-card-label {
      font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase;
      letter-spacing: 0.3px; margin-bottom: 8px;
    }
    .doc-card {
      background: #fff; border: 1px solid #ddd; border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      padding: 20px; cursor: pointer; position: relative;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .doc-card:hover {
      border-color: #aaa; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .doc-card-text {
      font-size: 11px; line-height: 1.6; color: #666; white-space: pre-line;
      overflow: hidden; max-height: 140px;
      mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);
    }
    .doc-card-actions {
      display: flex; gap: 16px; margin-top: 10px; font-size: 13px;
    }
    .doc-card-actions a {
      color: #222; text-decoration: underline; cursor: pointer; font-weight: 500;
    }
    .doc-card-actions a:hover { color: #555; }

    /* Preview Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 100; justify-content: center; align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-doc {
      background: #fff; width: 600px; max-height: 80vh; border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2); overflow-y: auto;
    }
    .modal-doc-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px; border-bottom: 1px solid #eee;
    }
    .modal-doc-header h3 { font-size: 16px; font-weight: 600; }
    .modal-close {
      background: none; border: none; font-size: 20px; cursor: pointer; color: #888;
    }
    .modal-close:hover { color: #222; }
    .modal-doc-body { padding: 24px; }
    .modal-doc-body .doc-letter {
      font-size: 13px; line-height: 1.8; color: #444;
    }
    .modal-doc-body .doc-letter p { margin-bottom: 12px; }
    .modal-doc-body .doc-letter .address { margin-bottom: 24px; }
    .modal-doc-body .doc-letter .subject { font-weight: 600; margin-bottom: 16px; }
    .modal-doc-body textarea {
      width: 100%; min-height: 300px; font-size: 13px; line-height: 1.8;
      border: 1px solid #ccc; padding: 16px; font-family: inherit; outline: none;
    }

    .footer-actions {
      margin-top: 40px; display: flex; justify-content: flex-end; gap: 16px;
    }
    .btn {
      padding: 10px 24px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
      background: #fff; font-weight: 600;
    }
    .btn:hover { background: #f5f5f5; }
    .btn-back { background: #fff; color: #222; border: 1px solid #ccc; }
    .btn-primary { background: #222; color: #fff; border-color: #222; }
    .btn-primary:hover { background: #444; }
  </style>
</head>
<body>

  <div class="breadcrumb">
    <a href="index.html">Mitglieder</a> &rsaquo; <a href="javascript:history.back()">Neuaufnahme</a> &rsaquo; Mitgliedschaft & Abrechnung
  </div>

  <h1>Schritt 3 - Mitgliedschaft & Abrechnung</h1>

  <div class="columns">
    <!-- Spalte 1: Mitgliedschaft -->
    <div>
      <div class="col-section">
        <h2>Mitgliedschaft</h2>
        <div class="form-row">
          <div class="form-group">
            <label>Mitgliederkategorie</label>
            <select id="kategorie">
              <option value="50">Einzelmitgliedschaft - CHF 50.00</option>
              <option value="100">Kollektivmitgliedschaft - CHF 100.00</option>
              <option value="0">Ehrenmitgliedschaft - CHF 0.00</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Vertragsbedingung</label>
            <select id="vertrag">
              <option>Normal</option>
              <option>1. Jahr kostenlos</option>
              <option>1. Jahr keine Rechnung</option>
              <option>kostenlos unbefristet</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Spalte 2: Abrechnung -->
    <div id="abrechnungCol">
      <div class="col-section">
        <h2>Abrechnung</h2>
        <div class="check-row">
          <input type="checkbox" id="rechnungCheck" checked>
          <label for="rechnungCheck">Rechnung über <strong id="betragLabel">CHF 50.00</strong> direkt erstellen</label>
        </div>
      </div>
    </div>

    <!-- Spalte 3: Kommunikation -->
    <div>
      <div class="col-section">
        <h2>Kommunikation</h2>
        <div class="check-row">
          <input type="radio" name="komm" id="kommBrief" checked>
          <select id="briefTyp">
            <option>Begrüssungsbrief</option>
            <option>Spezialbrief</option>
          </select>
          <label for="kommBrief">erstellen</label>
        </div>
        <div class="check-row" id="emailRow">
          <input type="radio" name="komm" id="kommEmail">
          <select id="emailTarget"></select>
          <label for="kommEmail">versenden</label>
        </div>
      </div>
    </div>
  </div>

  <!-- Dokument-Vorschau -->
  <div class="preview-row">
    <div></div>
    <div id="rechnungPreviewCol">
      <div class="doc-card-label">Rechnung</div>
      <div class="doc-card" onclick="openPreview('rechnung')">
        <div class="doc-card-text" id="rechnungPreviewText"></div>
      </div>
      <div class="doc-card-actions">
        <a onclick="openPreview('rechnung')">Vorschau</a>
        <a onclick="openEdit('rechnung')">Bearbeiten</a>
      </div>
    </div>
    <div id="kommPreviewCol">
      <div class="doc-card-label" id="kommPreviewLabel">Willkommensbrief</div>
      <div class="doc-card" id="kommPreviewCard">
        <div class="doc-card-text" id="briefPreviewText"></div>
      </div>
      <div class="doc-card-actions" id="kommPreviewActions">
        <a id="kommActionPreview">Vorschau</a>
        <a id="kommActionEdit">Bearbeiten</a>
      </div>
    </div>
  </div>

  <div class="footer-actions">
    <button class="btn btn-back" onclick="history.back()">&lsaquo; zurück zum Rechnungsempfänger</button>
    <button class="btn btn-primary" id="btnFertig">Fertigstellen und Brief und Rechnung versenden</button>
  </div>

  <!-- Preview Modal -->
  <div class="modal-overlay" id="previewOverlay">
    <div class="modal-doc">
      <div class="modal-doc-header">
        <h3 id="previewTitle"></h3>
        <button class="modal-close" onclick="closePreview()">&times;</button>
      </div>
      <div class="modal-doc-body" id="previewBody"></div>
    </div>
  </div>

  <script>
    const rechnungText = `Max und Anna Muster
Strasse 1
8717 Benken

Benken, ${new Date().toLocaleDateString('de-CH')}

Rechnung Nr. 2024-001

Sehr geehrte Damen und Herren

Wir erlauben uns, Ihnen folgende Mitgliedschaftsgebühr in Rechnung zu stellen:

Einzelmitgliedschaft 2024    CHF 50.00
──────────────────────────────────
Total                        CHF 50.00

Zahlbar innert 30 Tagen.

Freundliche Grüsse
Verein Musterverein`;

    const briefText = `Max und Anna Muster
Strasse 1
8717 Benken

Benken, ${new Date().toLocaleDateString('de-CH')}

Willkommen als neues Mitglied

Sehr geehrte Damen und Herren

Wir freuen uns sehr, Sie als neues Mitglied in unserem Verein begrüssen zu dürfen.

Ihre Mitgliedschaft ist ab sofort aktiv. Beiliegend finden Sie Ihre Rechnung für das laufende Jahr.

Als Mitglied profitieren Sie von folgenden Vorteilen:
- Zugang zu allen Vereinsanlässen
- Vergünstigungen bei Partnerorganisationen
- Monatlicher Newsletter

Bei Fragen stehen wir Ihnen jederzeit gerne zur Verfügung.

Freundliche Grüsse
Verein Musterverein`;

    const emailText = `An: mm@mail.ch
Betreff: Willkommen als neues Mitglied

Guten Tag

Wir freuen uns sehr, Sie als neues Mitglied in unserem Verein begrüssen zu dürfen.

Ihre Mitgliedschaft ist ab sofort aktiv. Im Anhang finden Sie Ihre Rechnung für das laufende Jahr.

Als Mitglied profitieren Sie von folgenden Vorteilen:
- Zugang zu allen Vereinsanlässen
- Vergünstigungen bei Partnerorganisationen
- Monatlicher Newsletter

Bei Fragen stehen wir Ihnen jederzeit gerne zur Verfügung.

Freundliche Grüsse
Verein Musterverein`;

    // ─── E-Mails aus sessionStorage laden ───
    const stored = JSON.parse(sessionStorage.getItem('erfassung_emails') || '{}');
    const allEmails = [...new Set(Object.values(stored).flat().filter(Boolean))];
    const emailSelect = document.getElementById('emailTarget');
    const emailRow = document.getElementById('emailRow');

    if (allEmails.length === 0) {
      emailRow.style.display = 'none';
    } else {
      allEmails.forEach(email => {
        const opt = document.createElement('option');
        opt.textContent = 'E-Mail an ' + email;
        opt.value = email;
        emailSelect.appendChild(opt);
      });
    }

    // Update Betrag & Rechnungsblock basierend auf Kategorie und Vertragsbedingung
    function updateAbrechnung() {
      const vertrag = document.getElementById('vertrag').value;
      const kategorieBetrag = parseFloat(document.getElementById('kategorie').value);
      const abrechnungCol = document.getElementById('abrechnungCol');
      const rechnungPreviewCol = document.getElementById('rechnungPreviewCol');

      if (vertrag === '1. Jahr keine Rechnung') {
        abrechnungCol.style.display = 'none';
        rechnungPreviewCol.style.display = 'none';
      } else {
        abrechnungCol.style.display = '';
        rechnungPreviewCol.style.display = '';
        const betrag = (vertrag === '1. Jahr kostenlos' || vertrag === 'kostenlos unbefristet')
          ? '0.00' : kategorieBetrag.toFixed(2);
        document.getElementById('betragLabel').textContent = 'CHF ' + betrag;
      }
    }

    document.getElementById('kategorie').addEventListener('change', updateAbrechnung);
    document.getElementById('vertrag').addEventListener('change', updateAbrechnung);

    const previewTitles = { rechnung: 'Vorschau Rechnung', brief: 'Vorschau Brief', email: 'Vorschau E-Mail' };
    const editTitles = { rechnung: 'Rechnung bearbeiten', brief: 'Brief bearbeiten', email: 'E-Mail bearbeiten' };
    const texts = { rechnung: rechnungText, brief: briefText, email: emailText };

    function openPreview(type) {
      document.getElementById('previewOverlay').classList.add('open');
      document.getElementById('previewTitle').textContent = previewTitles[type];
      document.getElementById('previewBody').innerHTML =
        '<div class="doc-letter">' + texts[type].split('\n').map(l => l ? '<p>' + l + '</p>' : '<br>').join('') + '</div>';
    }

    function openEdit(type) {
      document.getElementById('previewOverlay').classList.add('open');
      document.getElementById('previewTitle').textContent = editTitles[type];
      document.getElementById('previewBody').innerHTML =
        '<textarea>' + texts[type] + '</textarea>';
    }

    function closePreview() {
      document.getElementById('previewOverlay').classList.remove('open');
    }

    document.getElementById('previewOverlay').addEventListener('click', function (e) {
      if (e.target === this) closePreview();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closePreview();
    });

    // Vorschau-Text in Karten einfügen
    document.getElementById('rechnungPreviewText').textContent = rechnungText;
    document.getElementById('briefPreviewText').textContent = briefText;

    // Kommunikation: Brief/E-Mail Umschaltung
    function getKommType() {
      return document.getElementById('kommEmail').checked ? 'email' : 'brief';
    }

    function updateKommPreview() {
      const isEmail = getKommType() === 'email';
      const label = document.getElementById('kommPreviewLabel');
      const previewText = document.getElementById('briefPreviewText');
      const card = document.getElementById('kommPreviewCard');
      const actionPreview = document.getElementById('kommActionPreview');
      const actionEdit = document.getElementById('kommActionEdit');

      if (isEmail) {
        label.textContent = 'E-Mail';
        previewText.textContent = emailText;
        card.onclick = function () { openPreview('email'); };
        actionPreview.onclick = function () { openPreview('email'); };
        actionEdit.onclick = function () { openEdit('email'); };
      } else {
        label.textContent = 'Willkommensbrief';
        previewText.textContent = briefText;
        card.onclick = function () { openPreview('brief'); };
        actionPreview.onclick = function () { openPreview('brief'); };
        actionEdit.onclick = function () { openEdit('brief'); };
      }
    }

    document.getElementById('kommBrief').addEventListener('change', updateKommPreview);
    document.getElementById('kommEmail').addEventListener('change', updateKommPreview);
    updateKommPreview();

    // Fertigstellen → Betrag speichern und zur Bestätigung
    document.getElementById('btnFertig').addEventListener('click', function () {
      const betrag = parseFloat(document.getElementById('kategorie').value).toFixed(2);
      sessionStorage.setItem('erfassung_betrag', betrag);
      window.location.href = 'bestaetigung.html';
    });
  </script>
</body>
</html>
